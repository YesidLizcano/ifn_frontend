spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/inventario_forestal
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop  # Para desarrollo
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  port: 8080

logging:
  level:
    com.ifn: INFO
    org.hibernate.SQL: DEBUG